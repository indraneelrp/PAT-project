
services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
    image: pat-ros2:jazzy
    container_name: pat_ros2
    stdin_open: true
    tty: true
    volumes:
      - ./ros2_ws:/workspace/ros2_ws
    working_dir: /workspace/ros2_ws
    environment:
      - ROS_DOMAIN_ID=0
    command: bash
